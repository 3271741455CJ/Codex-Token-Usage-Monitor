name: Test, build and release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: windows-x64}
          - {os: macos-15-intel, target: macos-x64}
          - {os: macos-15, target: macos-arm64}
          - {os: ubuntu-22.04, target: linux-x64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check tag matches VERSION
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$(tr -d '\r\n' < VERSION)"
          fi
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare bundled Chinese font
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B build_tools/build.py --prepare-only
      - name: Synthetic Python regression tests
        env:
          # macOS /var is a system symlink; keep synthetic fixtures in a real
          # local directory without relaxing source-path link protections.
          TMPDIR: ${{ runner.temp }}
        run: python -B -m unittest discover -s tests -v
      - name: Dashboard regression tests
        run: node tests/test_dashboard.cjs
      - name: Native package and standalone smoke test
        env:
          TMPDIR: ${{ runner.temp }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REQUIRE_WINDOWS_SIGNING: ${{ vars.REQUIRE_WINDOWS_SIGNING }}
        run: python -B build_tools/build.py
      - name: Windows installed-app smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*-Setup.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'MonitorInstalled'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Installer smoke test failed' }
          python -B build_tools/smoke.py "$target/Codex-Token-Usage-Monitor.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
          $process = Start-Process -FilePath "$target/unins000.exe" -ArgumentList '/VERYSILENT', '/NORESTART' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Uninstaller smoke test failed' }
      - name: Record dependency versions
        shell: bash
        run: python -m pip freeze > release/dependencies-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: Verify complete asset set and compute checksums
        run: python -B build_tools/release_manifest.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
